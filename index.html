<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>时光cake私房烘焙 · 扫码点餐</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23B4682F'/%3E%3Cg fill='none' stroke='%23FAF2E7' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M8 24h16'/%3E%3Cpath d='M10 24v-2M22 24v-2'/%3E%3Cpath d='M11 22v-3h10v3'/%3E%3Cpath d='M12.5 19v-3h7v3'/%3E%3Cpath d='M12.5 16q1 -1.3 2 0t2 0t2 0'/%3E%3C/g%3E%3Ccircle cx='16' cy='13' r='1.4' fill='%23F2A03D'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#FAF2E7;
  --card:#FFFFFF;
  --ink:#3B2E27;
  --sub:#A08C79;
  --line:#EDE0CF;
  --accent:#B4682F;      /* 焦糖陶土 */
  --accent-soft:#F6E8D8;
  --orange:#E0A458;
  --mint:#7A9E6E;        /* 雾绿 */
  --danger:#A0482F;
  --shadow:0 6px 24px rgba(59,46,39,.08);
  --radius:16px;
  --maxw:460px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",-apple-system,sans-serif;
  background:#F0E6D8;
  color:var(--ink);
  line-height:1.5;
}
.app{
  max-width:var(--maxw);
  margin:0 auto;
  min-height:100vh;
  background:var(--bg);
  display:flex;
  flex-direction:column;
  position:relative;
  box-shadow:0 0 40px rgba(0,0,0,.08);
}
/* ===== 顶栏 ===== */
.topbar{
  position:sticky;top:0;z-index:30;
  background:var(--card);
  border-bottom:1px solid var(--line);
  padding:12px 16px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{
  width:38px;height:38px;border-radius:11px;flex:none;
  background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;
}
.brand-name{font-size:16px;font-weight:700;letter-spacing:.5px}
.brand-sub{font-size:11px;color:var(--sub);margin-top:1px}
.role-switch{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px;flex:none}
.role-btn{
  border:none;background:transparent;font-size:12px;color:var(--sub);
  padding:8px 14px;min-height:34px;border-radius:999px;cursor:pointer;font-family:inherit;
  transition:all .2s;
}
.role-btn.active{background:var(--ink);color:#fff}
/* ===== 视图容器 ===== */
main{flex:1;padding-bottom:88px}
.view{display:none;animation:fade .25s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* ===== 扫码页 ===== */
.scan-hero{
  padding:34px 24px 26px;text-align:center;
  background:linear-gradient(180deg,#F3E7D3 0%,var(--bg) 100%);
}
.scan-hero .shop-badge{
  width:76px;height:76px;margin:0 auto 16px;border-radius:22px;
  background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 24px rgba(180,104,47,.35);
}
.scan-hero h1{font-size:22px;font-weight:700;letter-spacing:1px}
.scan-hero .shop-desc{color:var(--sub);font-size:13px;margin-top:6px}
.qr-box{
  margin:0 20px;padding:26px;background:var(--card);border-radius:var(--radius);
  text-align:center;border:1px solid var(--line);
}
.qr-box .qr-art{
  width:120px;height:120px;margin:0 auto;padding:10px;border-radius:12px;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;
}
.qr-hint{font-size:12px;color:var(--sub);margin-top:14px}
.scan-actions{margin:20px}
/* ===== 按钮 ===== */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;padding:14px;border:none;border-radius:14px;cursor:pointer;
  font-size:16px;font-weight:600;font-family:inherit;transition:transform .1s, opacity .2s;
}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 8px 18px rgba(180,104,47,.3)}
.btn-dark{background:var(--ink);color:#fff}
.btn-ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn-sm{padding:8px 14px;font-size:13px;width:auto;border-radius:10px}
/* ===== 点餐页 ===== */
.cat-tabs{
  display:flex;gap:8px;overflow-x:auto;padding:14px 16px 12px;scrollbar-width:none;
  position:sticky;top:64px;background:var(--bg);z-index:10;
}
.cat-tabs::-webkit-scrollbar{display:none}
.cat-tab{
  flex:none;border:1px solid var(--line);background:var(--card);color:var(--sub);
  padding:8px 16px;border-radius:999px;font-size:13px;cursor:pointer;font-family:inherit;
  transition:all .2s;
}
.cat-tab.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.dish-list{padding:2px 16px 20px}
.dish-group-title{font-size:12px;color:var(--sub);margin:14px 2px 8px;font-weight:500}
.dish-card{
  display:flex;align-items:center;gap:14px;background:var(--card);
  border:1px solid var(--line);border-radius:var(--radius);padding:12px;
  margin-bottom:10px;transition:border-color .2s;
}
.dish-icon{
  width:64px;height:64px;border-radius:12px;flex:none;
  display:flex;align-items:center;justify-content:center;color:#fff;
}
.dish-img{width:64px;height:64px;border-radius:12px;flex:none;background-size:cover;background-position:center}
.dish-info{flex:1;min-width:0}
.dish-name{font-size:15px;font-weight:600}
.dish-tag{
  display:inline-block;font-size:10px;color:var(--accent);background:var(--accent-soft);
  padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:1px;
}
.dish-desc{font-size:12px;color:var(--sub);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dish-price{font-size:15px;font-weight:700;color:var(--accent);margin-top:6px}
.dish-price small{font-size:11px;font-weight:400;color:var(--sub)}
.add-wrap{display:flex;align-items:center;gap:10px;flex:none}
.step-btn{
  width:28px;height:28px;border-radius:50%;border:none;cursor:pointer;font-size:18px;line-height:1;
  display:flex;align-items:center;justify-content:center;font-family:inherit;
}
.step-btn.add{background:var(--accent);color:#fff}
.step-btn.minus{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.qty{font-size:15px;font-weight:600;min-width:14px;text-align:center}
/* ===== 底部购物车栏 ===== */
.cart-bar{
  position:fixed;bottom:0;left:0;right:0;z-index:20;
  max-width:var(--maxw);margin:0 auto;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,transparent,var(--bg) 30%);
}
.cart-bar-inner{
  background:var(--ink);border-radius:18px;color:#fff;padding:12px 16px;
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  box-shadow:0 10px 30px rgba(43,36,32,.35);
}
.cart-count{
  position:relative;width:44px;height:44px;border-radius:50%;background:var(--accent);
  display:flex;align-items:center;justify-content:center;flex:none;
}
.cart-count .num{
  position:absolute;top:-6px;right:-6px;background:var(--orange);color:var(--ink);
  min-width:20px;height:20px;border-radius:999px;font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;padding:0 5px;
}
.cart-total .t{font-size:11px;color:rgba(255,255,255,.65)}
.cart-total .amt{font-size:18px;font-weight:700}
.cart-total .amt small{font-size:12px;color:rgba(255,255,255,.65);font-weight:400}
.cart-go{background:var(--accent);border:none;color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
/* ===== 弹层 ===== */
.sheet-mask{
  position:fixed;inset:0;background:rgba(30,24,20,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s;
}
.sheet-mask.show{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:45;
  max-width:var(--maxw);margin:0 auto;
  background:var(--card);border-radius:22px 22px 0 0;
  transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);
  max-height:74vh;display:flex;flex-direction:column;
}
.sheet.show{transform:none}
.sheet-handle{width:40px;height:4px;border-radius:2px;background:var(--line);margin:10px auto 4px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:12px 18px 10px}
.sheet-head h3{font-size:16px;font-weight:700}
.sheet-clear{background:none;border:none;color:var(--sub);font-size:12px;cursor:pointer;font-family:inherit;padding:8px 4px;min-height:34px}
.sheet-body{flex:1;overflow-y:auto;padding:0 18px}
.cart-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.cart-item .ci-name{flex:1;font-size:14px;font-weight:500}
.cart-item .ci-price{font-size:14px;font-weight:700;color:var(--accent);margin-right:4px}
.sheet-foot{border-top:1px solid var(--line);padding:14px 18px calc(14px + env(safe-area-inset-bottom))}
.sheet-total{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sheet-total .amt{font-size:20px;font-weight:700;color:var(--accent)}
/* ===== 下单/成功 ===== */
.checkout{padding:20px}
.card-block{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.card-block h4{font-size:14px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.ck-item{display:flex;justify-content:space-between;font-size:14px;padding:6px 0}
.ck-item .n{color:var(--sub)}
.note-input{
  width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;
  font-size:14px;font-family:inherit;background:var(--card);color:var(--ink);resize:none;
}
.note-input:focus{outline:none;border-color:var(--accent)}
.success-wrap{padding:40px 24px;text-align:center}
.success-icon{
  width:80px;height:80px;margin:0 auto 20px;border-radius:50%;background:var(--mint);
  color:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 12px 26px rgba(74,157,124,.35);
}
.success-wrap h1{font-size:22px;font-weight:700}
.success-wrap .sub{color:var(--sub);font-size:14px;margin-top:8px}
.take-num{
  margin:22px auto;padding:18px 24px;background:var(--card);border:2px dashed var(--accent);border-radius:var(--radius);
  max-width:280px;
}
.take-num .lbl{font-size:13px;color:var(--sub)}
.take-num .val{font-size:46px;font-weight:700;margin-top:6px;letter-spacing:2px;color:var(--accent)}
/* ===== 商家端 ===== */
.merch-head{padding:16px 16px 4px}
.merch-head .stat-row{display:flex;gap:10px;margin-top:12px}
.stat-box{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stat-box .v{font-size:20px;font-weight:700}
.stat-box .k{font-size:11px;color:var(--sub);margin-top:2px}
.order-list{padding:14px 16px 20px}
.order-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.order-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.take-pill{
  font-size:16px;font-weight:700;color:var(--accent);background:var(--accent-soft);
  padding:3px 12px;border-radius:8px;
}
.order-time{font-size:11px;color:var(--sub)}
.order-items{font-size:13px;color:var(--sub);margin-bottom:10px}
.order-bottom{display:flex;justify-content:space-between;align-items:center;gap:10px}
.order-amt{font-size:16px;font-weight:700}
.status-tag{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px}
.status-new{color:var(--danger);background:#FBEBE6}
.status-cooking{color:var(--orange);background:#FCF1E0}
.status-served{color:var(--mint);background:#E7F1EC}
.merch-empty{text-align:center;color:var(--sub);padding:50px 20px;font-size:14px}
.merch-empty svg{margin-bottom:12px;opacity:.4}
/* ===== 晒图墙 ===== */
.top-actions{display:flex;align-items:center;gap:8px}
.feed-btn{
  display:flex;align-items:center;gap:5px;background:var(--accent-soft);color:var(--accent);
  border:none;padding:8px 13px;border-radius:999px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:600;
  white-space:nowrap;min-height:34px;transition:all .2s;
}
.feed-btn:active{transform:scale(.97)}
.feed-page{padding-bottom:20px}
.feed-head{padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
.feed-head h3{font-size:18px;font-weight:700}
.back-btn{background:none;border:none;color:var(--accent);font-size:13px;cursor:pointer;font-family:inherit;padding:6px 4px;min-height:34px}
.feed-composer{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:2px 16px 14px}
.feed-text{width:100%;border:none;resize:none;font-size:16px;font-family:inherit;min-height:52px;color:var(--ink);line-height:1.6}
.feed-text:focus{outline:none}
.feed-drafts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.feed-draft{width:52px;height:52px;border-radius:8px;background-size:cover;background-position:center;position:relative;flex:none}
.feed-draft .rm{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:var(--danger);color:#fff;border:none;font-size:12px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.feed-toolbar{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:10px;margin-top:6px}
.feed-add-label{display:flex;align-items:center;gap:6px;color:var(--sub);font-size:12px;cursor:pointer;padding:6px 4px}
.feed-post{background:var(--accent);color:#fff;border:none;padding:9px 18px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.feed-item{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:0 16px 12px}
.feed-meta{display:flex;align-items:center;gap:10px}
.feed-avatar{width:40px;height:40px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;flex:none}
.feed-uname{font-size:14px;font-weight:600}
.feed-utime{font-size:11px;color:var(--sub);margin-top:1px}
.feed-text-body{font-size:14px;color:var(--ink);margin:10px 0;line-height:1.6}
.feed-imgs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.feed-img{aspect-ratio:1;border-radius:10px;background-size:cover;background-position:center}
.feed-imgs.one{grid-template-columns:1fr;max-width:240px}
.feed-img-ph{
  aspect-ratio:4/3;border-radius:10px;
  background:linear-gradient(135deg,var(--accent-soft),var(--line));
  display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--sub);gap:8px;font-size:12px;
}
/* ===== toast ===== */
#toast{
  position:fixed;left:50%;top:18%;transform:translate(-50%,-8px);z-index:60;
  background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;
  opacity:0;pointer-events:none;transition:all .25s;white-space:nowrap;
}
#toast.show{opacity:1;transform:translate(-50%,0)}
.hide{display:none!important}
@media(min-width:520px){
  main{padding-bottom:110px}
}
</style>
</head>
<body>
<div class="app">
  <!-- ===== 顶栏 ===== -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" id="brandMark"></div>
      <div>
        <div class="brand-name" id="brandName">时光caka私房烘焙</div>
        <div class="brand-sub" id="brandSub">扫码点餐 · 排号</div>
      </div>
    </div>
    <div class="top-actions">
      <button class="feed-btn" id="feedBtn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>晒图墙</button>
      <div class="role-switch">
        <button class="role-btn active" data-role="customer" id="roleCustomer">顾客</button>
        <button class="role-btn" data-role="merchant" id="roleMerchant">商家</button>
      </div>
    </div>
  </header>

  <!-- ===== 视图区 ===== -->
  <main id="main">

    <!-- 扫码进入页 -->
    <section class="view" id="view-scan">
      <div class="scan-hero">
        <div class="shop-badge" id="heroBadge"></div>
        <h1>时光cake私房烘焙</h1>
        <p class="shop-desc">纯安佳动物奶油 同城配送 新鲜制作</p>
      </div>
      <div class="qr-box">
        <div class="qr-art" id="qrArt"></div>
        <div class="qr-hint">顾客手机扫描桌上二维码，进入点餐页</div>
      </div>
      <div class="scan-actions">
        <button class="btn btn-primary" id="enterMenu">进入点餐</button>
      </div>
    </section>

    <!-- 点餐页 -->
    <section class="view" id="view-menu">
      <div class="cat-tabs" id="catTabs"></div>
      <div class="dish-list" id="dishList"></div>
    </section>

    <!-- 下单成功页 -->
    <section class="view" id="view-success">
      <div class="success-wrap">
        <div class="success-icon"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
        <h1>下单成功</h1>
        <p class="sub">已通知商家，请稍候取餐</p>
        <div class="take-num">
          <div class="lbl">您的取餐号</div>
          <div class="val" id="successTakeNo">--</div>
        </div>
        <p style="color:var(--sub);font-size:12px" id="successOrderId"></p>
        <p style="color:var(--sub);font-size:13px;margin-top:4px">预计等待 15-20 分钟，叫号取餐</p>
      </div>
      <div class="scan-actions">
        <button class="btn btn-dark" id="againOrder">再点一单</button>
        <button class="btn btn-ghost" id="backHome" style="margin-top:10px">返回首页</button>
      </div>
    </section>

    <!-- 商家接单页 -->
    <section class="view" id="view-merchant">
      <div class="merch-head">
        <h3 style="font-size:18px;font-weight:700">接单台</h3>
        <div class="stat-row">
          <div class="stat-box"><div class="v" id="statNew">0</div><div class="k">待接单</div></div>
          <div class="stat-box"><div class="v" id="statCooking">0</div><div class="k">制作中</div></div>
          <div class="stat-box"><div class="v" id="statDone">0</div><div class="k">今日已出</div></div>
        </div>
      </div>
      <div class="order-list" id="orderList"></div>
    </section>

    <!-- 晒图墙 -->
    <section class="view" id="view-feed">
      <div class="feed-head">
        <h3>晒图墙</h3>
        <button class="back-btn" id="feedBack">返回</button>
      </div>
      <div class="feed-composer">
        <textarea class="feed-text" id="feedText" placeholder="分享你尝到的美味蛋糕…"></textarea>
        <div class="feed-drafts" id="feedDrafts"></div>
        <div class="feed-toolbar">
          <label class="feed-add-label">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
            选图上传
            <input type="file" id="feedImgInput" accept="image/*" multiple style="display:none">
          </label>
          <button class="feed-post" id="feedPost">发布</button>
        </div>
      </div>
      <div class="feed-list" id="feedList"></div>
    </section>

  </main>

  <!-- ===== 底部购物车栏 ===== -->
  <div class="cart-bar hide" id="cartBar">
    <div class="cart-bar-inner">
      <div class="cart-count">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l1 13H5L6 7z"/><path d="M9 10V6a3 3 0 0 1 6 0v4"/></svg>
        <span class="num" id="cartCount">0</span>
      </div>
      <div class="cart-total">
        <div class="t">合计</div>
        <div class="amt" id="cartAmount">¥0<small> 起</small></div>
      </div>
      <button class="cart-go" id="goCheckout">去下单</button>
    </div>
  </div>

  <!-- ===== 购物车弹层 ===== -->
  <div class="sheet-mask" id="sheetMask"></div>
  <div class="sheet" id="cartSheet">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <h3>已选菜品</h3>
      <button class="sheet-clear" id="clearCart">清空</button>
    </div>
    <div class="sheet-body" id="cartSheetBody"></div>
    <div class="sheet-foot">
      <div class="sheet-total"><span>合计</span><span class="amt" id="sheetTotal">¥0</span></div>
      <button class="btn btn-primary" id="copyOrderBtn">复制点餐清单 · 发给我</button>
      <button class="btn btn-ghost" id="confirmCheckout" style="margin-top:8px">确认下单（店内取餐号）</button>
    </div>
  </div>

  <div id="toast"></div>
</div>
<script>
/* ================= 图标库 ================= */
const S = {fill:"none",stroke:"currentColor",sw:"2",slc:"round",slj:"round"};
function svg(inner,w=22){
  return `<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="${S.fill}" stroke="${S.stroke}" stroke-width="${S.sw}" stroke-linecap="${S.slc}" stroke-linejoin="${S.slj}">${inner}</svg>`;
}
const ICON = {
  brand: svg(`<path d="M4 19h16"/><path d="M6 19v-3M18 19v-3"/><path d="M6.5 16v-4h11v4"/><path d="M8 12V8h8v4"/><path d="M8 8q1 -1.4 2 0t2 0t2 0t2 0"/><path d="M12 7V4.5"/><path d="M12 4.5q-.8 .7 0 1.4 .8 -.7 0 -1.4z"/>`,26),
  shop: `<svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor"><rect x="2.5" y="17.5" width="19" height="3" rx="1.5"/><path d="M6 17.5V12h12v5.5z"/><path d="M7.5 12V7h10v5z"/><path d="M7.5 7q1 -1.3 2 0t2 0t2 0t2 0t2 0"/><circle cx="9.5" cy="5.3" r="1.3"/><circle cx="12.5" cy="4.8" r="1.3"/><circle cx="15.5" cy="5.3" r="1.3"/></svg>`,
  flame: svg(`<path d="M12 3c1 3-3 4.5-3 8a3 3 0 0 0 6 0c0-2-1-3-1-3s3 2 3 6a5 5 0 0 1-10 0c0-5 5-8 5-11z"/>`),
  cake: svg(`<rect x="4" y="12" width="16" height="9" rx="1.5"/><path d="M6 12V8a6 6 0 0 1 12 0v4"/><path d="M12 8V5"/><path d="M9 5h6"/>`),
  dessert: svg(`<path d="M7 10a5 5 0 0 1 10 0"/><path d="M7 10v7a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-7"/><path d="M7 10h10"/>`),
  bread: svg(`<path d="M5 11c0-3 3-5 7-5s7 2 7 5"/><path d="M5 11h14l-1 7a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2l-1-7z"/><path d="M8 18v2M12 18v2M16 18v2"/>`),
  cup: svg(`<path d="M5 3h14v6a7 7 0 0 1-14 0V3z"/><path d="M5 6h14"/><path d="M9 17.5V20a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2v-2.5"/>`),
  cart: svg(`<path d="M6 7h12l1 13H5L6 7z"/><path d="M9 10V6a3 3 0 0 1 6 0v4"/>`,22),
  qr: svg(`<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3M20 14v3M17 17v3M14 20h3"/>`,52),
  check: svg(`<path d="M20 6 9 17l-5-5"/>`,40),
  empty: svg(`<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v6"/>`,40),
};

/* ================= 菜品数据（示例） ================= */
const CATS = [
  {key:"signature", name:"招牌", color:"#B4682F", icon:ICON.flame},
  {key:"cake",      name:"蛋糕", color:"#C88A5E", icon:ICON.cake},
  {key:"dessert",   name:"甜品", color:"#D9A05B", icon:ICON.dessert},
  {key:"bread",     name:"面包", color:"#A57A52", icon:ICON.bread},
  {key:"drink",     name:"三明治", color:"#7A9A6E", icon:ICON.cup},
];
const MENU = [
  {id:"s1", cat:"signature", name:"招牌奶油蛋糕", desc:"6寸 · 纯安佳动物奶油", price:168, tag:"热销"},
  {id:"s2", cat:"signature", name:"芒果千层",     desc:"层层薄皮 · 芒果夹心", price:58},
  {id:"s3", cat:"signature", name:"提拉米苏",     desc:"可可香浓 · 口感绵密", price:45, tag:"经典"},
  {id:"c1", cat:"cake", name:"草莓奶油蛋糕", desc:"4寸 · 新鲜草莓",     price:88, tag:"当季"},
  {id:"c2", cat:"cake", name:"巧克力慕斯",     desc:"丝滑浓郁 · 微苦回甘", price:52},
  {id:"c3", cat:"cake", name:"红丝绒蛋糕",     desc:"经典红丝绒 · 乳酪夹心", price:56},
  {id:"ds1", cat:"dessert", name:"葡式蛋挞",   desc:"2只 · 现烤酥皮",     price:15},
  {id:"ds2", cat:"dessert", name:"提子奶酥",   desc:"酥松掉渣 · 奶香",     price:22},
  {id:"ds3", cat:"dessert", name:"杨枝甘露",   desc:"芒果西柚 · 冰爽",     price:25, tag:"冰镇"},
  {id:"b1", cat:"bread", name:"全麦吐司",     desc:"低糖 · 麦香浓郁",     price:18},
  {id:"b2", cat:"bread", name:"黄油可颂",     desc:"外酥内软 · 起酥",     price:12},
  {id:"b3", cat:"bread", name:"肉松小贝",     desc:"4只 · 海苔肉松",     price:30},
  {id:"k1", cat:"drink", name:"奥尔良鸡腿排三明治", desc:"", price:6},
  {id:"k2", cat:"drink", name:"方火腿火鸡面三明治", desc:"", price:6},
  {id:"k3", cat:"drink", name:"火山石烤肠三明治",   desc:"", price:6},
];
const state = {
  role:"customer",           // customer | merchant
  customerView:"scan",       // 顾客当前视图
  cat:"signature",
  cart:{},                   // {dishId: qty}
  orders:[],                 // 订单列表
  orderSeq:0,
};

/* ================= 工具 ================= */
const $ = s => document.querySelector(s);
const dish = id => MENU.find(d=>d.id===id);
const catOf = key => CATS.find(c=>c.key===key);
const money = n => "¥"+n;
const fmtTime = d => {const p=n=>String(n).padStart(2,"0");return `${p(d.getHours())}:${p(d.getMinutes())}`;};
let toastTimer=null;
function toast(msg){
  const t=$("#toast");t.textContent=msg;t.classList.add("show");
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),1800);
}
function cartCount(){return Object.values(state.cart).reduce((a,b)=>a+b,0);}
function cartAmount(){return Object.entries(state.cart).reduce((a,[id,q])=>a+dish(id).price*q,0);}

/* ================= 视图切换 ================= */
function showView(name){
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  const el=$("#view-"+name);
  if(el) el.classList.add("active");
  // 底部购物车栏只在顾客点餐页显示（晒图墙不显示）
  $("#cartBar").classList.toggle("hide", !(state.role==="customer" && state.customerView==="menu" && name!=="feed"));
}
function enterMenu(){ state.customerView="menu"; showView("menu"); renderMenu(); renderCartBar(); }
function goScan(){ state.customerView="scan"; state.cart={}; showView("scan"); renderCartBar(); }
function goMerchant(){ state.role="merchant"; $("#roleCustomer").classList.remove("active"); $("#roleMerchant").classList.add("active"); showView("merchant"); renderMerchant(); }
function goCustomer(){ state.role="customer"; $("#roleMerchant").classList.remove("active"); $("#roleCustomer").classList.add("active"); showView(state.customerView); renderMenu(); renderCartBar(); }

/* ================= 点餐渲染 ================= */
function renderCatTabs(){
  $("#catTabs").innerHTML = CATS.map(c=>
    `<button class="cat-tab ${c.key===state.cat?"active":""}" data-cat="${c.key}">${c.name}</button>`
  ).join("");
  document.querySelectorAll(".cat-tab").forEach(b=>{
    b.onclick=()=>{ state.cat=b.dataset.cat; renderCatTabs(); renderMenu(); };
  });
}
function renderMenu(){
  const list=MENU.filter(d=>d.cat===state.cat);
  $("#dishList").innerHTML = list.map(d=>{
    const c=catOf(d.cat); const q=state.cart[d.id]||0;
    return `
      <div class="dish-card">
        ${d.img
          ? `<div class="dish-img" style="background-image:url('${d.img}')"></div>`
          : `<div class="dish-icon" style="background:${c.color}">${c.icon}</div>`}
        <div class="dish-info">
          <div class="dish-name">${d.name}${d.tag?`<span class="dish-tag">${d.tag}</span>`:""}</div>
          <div class="dish-desc">${d.desc}</div>
          <div class="dish-price">${money(d.price)}<small> / 份</small></div>
        </div>
        <div class="add-wrap">
          ${q>0?`<button class="step-btn minus" data-id="${d.id}">−</button>`:""}
          ${q>0?`<span class="qty">${q}</span>`:""}
          <button class="step-btn add" data-id="${d.id}">+</button>
        </div>
      </div>`;
  }).join("");
  document.querySelectorAll(".dish-card .step-btn.add").forEach(b=>b.onclick=()=>addDish(b.dataset.id));
  document.querySelectorAll(".dish-card .step-btn.minus").forEach(b=>b.onclick=()=>minusDish(b.dataset.id));
}
function addDish(id){
  state.cart[id]=(state.cart[id]||0)+1;
  renderMenu(); renderCartBar();
  const el=document.querySelector(`.dish-card [data-id="${id}"].add`);
  if(el){el.style.transform="scale(1.15)";setTimeout(()=>el.style.transform="",150);}
}
function minusDish(id){
  if(state.cart[id]>1) state.cart[id]--;
  else delete state.cart[id];
  renderMenu(); renderCartBar();
}

/* ================= 购物车栏 ================= */
function renderCartBar(){
  const n=cartCount();
  $("#cartCount").textContent=n;
  $("#cartAmount").innerHTML = n>0 ? `${money(cartAmount())}` : `¥0<small> 起</small>`;
  $("#cartBar").classList.toggle("hide", !(state.role==="customer" && state.customerView==="menu"));
}
function openSheet(){
  if(cartCount()===0){ toast("购物车还是空的，先加点菜吧"); return; }
  renderSheet(); $("#cartSheet").classList.add("show"); $("#sheetMask").classList.add("show");
}
function closeSheet(){
  $("#cartSheet").classList.remove("show"); $("#sheetMask").classList.remove("show");
}
function renderSheet(){
  const items=Object.entries(state.cart).filter(([,q])=>q>0);
  $("#cartSheetBody").innerHTML =
    items.map(([id,q])=>{const d=dish(id);return `
      <div class="cart-item">
        <span class="ci-name">${d.name}</span>
        <span class="ci-price">${money(d.price)}</span>
        <div class="add-wrap">
          <button class="step-btn minus" data-id="${id}">−</button>
          <span class="qty">${q}</span>
          <button class="step-btn add" data-id="${id}">+</button>
        </div>
      </div>`;}).join("")
    + `<div class="card-block">
         <h4>${svg(`<path d="M4 6h16M4 12h16M4 18h10"/>`,16)} 备注</h4>
         <textarea class="note-input" id="noteInput" rows="2" placeholder="口味偏好、忌口等（可选）"></textarea>
       </div>`;
  document.querySelectorAll("#cartSheetBody .step-btn.add").forEach(b=>b.onclick=()=>{addDish(b.dataset.id);renderSheet();});
  document.querySelectorAll("#cartSheetBody .step-btn.minus").forEach(b=>b.onclick=()=>{minusDish(b.dataset.id);renderSheet();});
  $("#sheetTotal").textContent=money(cartAmount());
}

/* ================= 下单 ================= */
function orderText(){
  const items=Object.entries(state.cart).filter(([,q])=>q>0);
  if(items.length===0) return "";
  const lines=items.map(([id,q])=>{const d=dish(id);return `${d.name} ×${q}（${money(d.price*q)}）`;});
  const note=($("#noteInput")?.value||"").trim();
  const txt=["【时光cake私房烘焙】",...lines, note?`备注：${note}`:"",`合计：${money(cartAmount())}`].filter(Boolean).join("\n");
  return txt;
}
function copyOrder(){
  if(cartCount()===0){ toast("购物车还是空的，先加点菜吧"); return; }
  const txt=orderText();
  const ta=document.createElement("textarea");
  ta.value=txt; ta.style.position="fixed"; ta.style.top="0"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  let ok=false;
  try{ ok=document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta);
  if(navigator.clipboard && !ok){ navigator.clipboard.writeText(txt).then(()=>ok=true).catch(()=>{}); }
  toast(ok?"清单已复制，粘贴发微信给老板":"请长按手动复制这段清单");
}
function confirmOrder(){
  if(cartCount()===0) return;
  const items=Object.entries(state.cart).filter(([,q])=>q>0).map(([id,q])=>({name:dish(id).name,price:dish(id).price,qty:q}));
  state.orderSeq++;
  const order={
    id:"D"+(1000+state.orderSeq),
    takeNo:state.orderSeq,
    items,
    total:cartAmount(),
    note:$("#noteInput")?.value.trim()||"",
    time:fmtTime(new Date()),
    status:"new",
  };
  state.orders.unshift(order);
  closeSheet();
  state.cart={};
  state.customerView="success";
  showView("success");
  $("#successTakeNo").textContent=order.takeNo;
  $("#successOrderId").textContent="订单号 "+order.id;
  toast("下单成功，您的取餐号 "+order.takeNo);
}

/* ================= 商家端 ================= */
function statusTag(s){
  const map={new:["status-new","待接单"],cooking:["status-cooking","制作中"],served:["status-served","已出餐"]};
  return `<span class="status-tag ${map[s][0]}">${map[s][1]}</span>`;
}
function renderMerchant(){
  const newN=state.orders.filter(o=>o.status==="new").length;
  const cookN=state.orders.filter(o=>o.status==="cooking").length;
  const doneN=state.orders.filter(o=>o.status==="served").length;
  $("#statNew").textContent=newN; $("#statCooking").textContent=cookN; $("#statDone").textContent=doneN;
  if(state.orders.length===0){
    $("#orderList").innerHTML=`<div class="merch-empty">${ICON.empty}<br>暂无订单<br><span style="font-size:12px">到「顾客」端下一单试试</span></div>`;
    return;
  }
  const sort={new:0,cooking:1,served:2};
  const list=[...state.orders].sort((a,b)=>sort[a.status]-sort[b.status]);
  $("#orderList").innerHTML = list.map(o=>`
    <div class="order-card">
      <div class="order-top">
        <span class="take-pill">${o.takeNo} 号</span>
        ${statusTag(o.status)}
      </div>
      <div class="order-items">${o.items.map(i=>`${i.name} ×${i.qty}`).join(" · ")}${o.note?`<br><span style="color:var(--ink)">备注：${o.note}</span>`:""}</div>
      <div class="order-bottom">
        <div class="order-amt">${money(o.total)}<span style="font-size:11px;color:var(--sub);font-weight:400"> · ${o.time}</span></div>
        <span style="font-size:11px;color:var(--sub)">${o.id}</span>
        ${o.status==="new"?`<button class="btn btn-sm btn-primary" data-act="cook" data-id="${o.id}">接单</button>`
        :o.status==="cooking"?`<button class="btn btn-sm btn-dark" data-act="serve" data-id="${o.id}">叫号出餐</button>`
        :`<button class="btn btn-sm btn-ghost" disabled>已完成</button>`}
      </div>
    </div>`).join("");
  document.querySelectorAll("#orderList [data-act]").forEach(b=>b.onclick=()=>{
    const o=state.orders.find(x=>x.id===b.dataset.id); if(!o) return;
    o.status = b.dataset.act==="cook" ? "cooking" : "served";
    renderMerchant();
    toast(b.dataset.act==="cook"?"已接单，开始制作":`已叫号，请 ${o.takeNo} 号取餐`);
  });
}

/* ================= 晒图墙 ================= */
const FEED=[
  {id:"f1",user:"店主",avatar:"店",color:"#B4682F",time:"今天 10:24",text:"今天现烤的草莓奶油蛋糕上线啦～新鲜草莓配动物奶油，欢迎下单！",imgs:[]},
  {id:"f2",user:"晓晓",avatar:"晓",color:"#C88A5E",time:"昨天 16:40",text:"给闺蜜订的生日蛋糕，颜值和味道都在线",imgs:[]},
];
let feedDraft=[];   // 待发布的本地图（dataURL）
let feedSeq=3;
let feedPrev="scan";
function renderFeedDraft(){
  $("#feedDrafts").innerHTML = feedDraft.map((d,i)=>`
    <div class="feed-draft" style="background-image:url('${d}')">
      <button class="rm" data-i="${i}">×</button>
    </div>`).join("");
  document.querySelectorAll(".feed-draft .rm").forEach(b=>b.onclick=()=>{feedDraft.splice(+b.dataset.i,1);renderFeedDraft();});
}
function renderFeed(){
  $("#feedList").innerHTML = FEED.map(f=>{
    const imgs = f.imgs.length
      ? `<div class="feed-imgs ${f.imgs.length===1?"one":""}">${f.imgs.map(u=>`<div class="feed-img" style="background-image:url('${u}')"></div>`).join("")}</div>`
      : `<div class="feed-img-ph">${ICON.cake}<span>蛋糕图待上传</span></div>`;
    return `
    <div class="feed-item">
      <div class="feed-meta">
        <div class="feed-avatar" style="background:${f.color}">${f.avatar}</div>
        <div>
          <div class="feed-uname">${f.user}</div>
          <div class="feed-utime">${f.time}</div>
        </div>
      </div>
      <div class="feed-text-body">${f.text}</div>
      ${imgs}
    </div>`;
  }).join("");
}
function openFeed(){
  feedPrev = state.role==="customer" ? state.customerView : "merchant";
  showView("feed"); renderFeed(); renderFeedDraft();
}
function closeFeed(){ showView(feedPrev); }
function publishFeed(){
  const text=$("#feedText").value.trim();
  if(!text && feedDraft.length===0){ toast("写点文字或选张图再发布"); return; }
  FEED.unshift({id:"f"+(feedSeq++),user:"我",avatar:"我",color:"#B4682F",time:fmtTime(new Date()),text,imgs:[...feedDraft]});
  feedDraft=[]; $("#feedText").value=""; renderFeed(); renderFeedDraft(); toast("已发布");
}
function onFeedImg(e){
  const left=3-feedDraft.length;
  [...e.target.files].slice(0,left).forEach(f=>{
    const r=new FileReader();
    r.onload=ev=>{ feedDraft.push(ev.target.result); renderFeedDraft(); };
    r.readAsDataURL(f);
  });
  e.target.value="";
}

/* ================= 初始化 ================= */
function init(){
  $("#brandMark").innerHTML=ICON.brand;
  $("#heroBadge").innerHTML=ICON.shop;
  $("#qrArt").innerHTML=ICON.qr;
  renderCatTabs();

  $("#enterMenu").onclick=enterMenu;
  $("#roleCustomer").onclick=goCustomer;
  $("#roleMerchant").onclick=goMerchant;
  $("#goCheckout").onclick=openSheet;
  $("#sheetMask").onclick=closeSheet;
  $("#confirmCheckout").onclick=confirmOrder;
  $("#copyOrderBtn").onclick=copyOrder;
  $("#clearCart").onclick=()=>{ state.cart={}; renderSheet(); renderCartBar(); toast("已清空"); };
  $("#againOrder").onclick=enterMenu;
  $("#backHome").onclick=goScan;
  $("#feedBtn").onclick=openFeed;
  $("#feedBack").onclick=closeFeed;
  $("#feedPost").onclick=publishFeed;
  $("#feedImgInput").onchange=onFeedImg;

  showView("scan");
}
init();
</script>
</body>
</html>
